name: Build desktop packages

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows installer
            os: windows-latest
            target: --win nsis
            artifacts: release/*.exe
            artifact_name: MoriXterm-windows
          - name: Linux AppImage and DEB
            os: ubuntu-latest
            target: --linux AppImage deb
            artifacts: |
              release/*.AppImage
              release/*.deb
            artifact_name: MoriXterm-linux

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node scripts/verify-release-tag.mjs "$GITHUB_REF_NAME"

      - name: Build package
        run: npm run package -- ${{ matrix.target }} --publish never
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Download desktop packages
        uses: actions/download-artifact@v8
        with:
          pattern: MoriXterm-*
          path: release-assets
          merge-multiple: true

      - name: Create release metadata and checksums
        run: |
          node scripts/create-release-metadata.mjs "$GITHUB_REF_NAME" release-assets/latest.json
          cd release-assets
          sha256sum -- * > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-release.sh "$GITHUB_REF_NAME" release-assets
