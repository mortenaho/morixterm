name: Deploy website

on:
  push:
    branches:
      - main
      - feature/security-hardening
    paths:
      - 'website/**'
      - 'public/branding/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Prepare website
        run: |
          mkdir -p _site/assets
          cp -R website/. _site/
          cp public/branding/morixterm-logo.svg _site/assets/morixterm-logo.svg
          cp public/branding/morixterm-home-brand-v2.png _site/assets/morixterm-brand.png

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
