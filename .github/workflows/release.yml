name: Build and Release

on:
  workflow_dispatch:

concurrency:
  group: morixterm-release
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

env:
  BUILD_TYPE: Release

jobs:
  prepare:
    name: Select next release version
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Require main branch
        shell: bash
        run: test "$GITHUB_REF" = 'refs/heads/main'

      - name: Checkout main with tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select next version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="$(python3 scripts/next_release_version.py)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux AppImage and DEB
    needs: prepare
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ patchelf file desktop-file-utils \
            qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools qt6-tools-dev qt6-tools-dev-tools \
            libgl1-mesa-dev libx11-dev libxfixes-dev libxkbcommon-x11-0 libxcb-cursor0 \
            libsecret-tools openssh-client sshpass libqt6svg6 zip unzip

      - name: QML duplicate property preflight
        run: python3 scripts/check-qml-duplicate-properties.py qml

      - name: SQLite session migration smoke test
        run: python3 scripts/smoke-session-migration.py

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${BUILD_TYPE} -DCMAKE_INSTALL_PREFIX=/usr -DMORIXTERM_VERSION=${RELEASE_VERSION}

      - name: QML syntax check
        shell: bash
        run: |
          QMLFORMAT="$(command -v qmlformat || true)"
          if [ -z "$QMLFORMAT" ] && [ -x /usr/lib/qt6/bin/qmlformat ]; then
            QMLFORMAT=/usr/lib/qt6/bin/qmlformat
          fi
          if [ -z "$QMLFORMAT" ]; then
            echo "qmlformat not found" >&2
            exit 1
          fi
          while IFS= read -r -d '' file; do
            "$QMLFORMAT" "$file" >/dev/null
          done < <(find qml -name '*.qml' -print0)

      - name: Build
        run: cmake --build build --parallel

      - name: RDP argument tests
        run: ctest --test-dir build --output-on-failure

      - name: Package DEB
        run: |
          mkdir -p release
          cd build
          cpack -G DEB
          mv ./*.deb ../release/

      - name: Prepare AppDir
        run: |
          rm -rf AppDir
          DESTDIR="$GITHUB_WORKSPACE/AppDir" cmake --install build

      - name: Download linuxdeploy
        run: |
          curl -L --fail --retry 3 -o linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -L --fail --retry 3 -o linuxdeploy-plugin-qt-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          QML_SOURCES_PATHS: '${{ github.workspace }}/qml'
          QMAKE: /usr/bin/qmake6
          OUTPUT: 'MoriXterm-${{ env.RELEASE_TAG }}-Linux-x86_64.AppImage'
        run: |
          export PATH="$GITHUB_WORKSPACE:$PATH"
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --desktop-file packaging/linux/morixtrem.desktop \
            --icon-file assets/morixtrem.png \
            --plugin qt \
            --output appimage
          mv MoriXterm-*.AppImage "release/${OUTPUT}" 2>/dev/null || mv *.AppImage "release/${OUTPUT}"

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: release/*
          if-no-files-found: error

  windows:
    name: Windows EXE
    needs: prepare
    runs-on: windows-2022
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: QML duplicate property preflight
        shell: pwsh
        run: python scripts/check-qml-duplicate-properties.py qml

      - name: SQLite session migration smoke test
        shell: pwsh
        run: python scripts/smoke-session-migration.py

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DMORIXTERM_VERSION=$env:RELEASE_VERSION"

      - name: Build
        shell: pwsh
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          Copy-Item build/bin/Release/morixtrem.exe dist/windows/morixtrem.exe
          windeployqt --release --qmldir qml --dir dist/windows dist/windows/morixtrem.exe

      - name: Bundle OpenSSH client
        shell: pwsh
        run: |
          $release = Invoke-RestMethod -Headers @{ 'User-Agent' = 'MoriXterm' } -Uri 'https://api.github.com/repos/PowerShell/Win32-OpenSSH/releases/latest'
          $asset = $release.assets | Where-Object { $_.name -eq 'OpenSSH-Win64.zip' } | Select-Object -First 1
          if (-not $asset) { throw 'OpenSSH-Win64.zip was not found in the latest Win32-OpenSSH release.' }
          $archive = Join-Path $env:RUNNER_TEMP 'OpenSSH-Win64.zip'
          Invoke-WebRequest -Headers @{ 'User-Agent' = 'MoriXterm' } -Uri $asset.browser_download_url -OutFile $archive
          $extract = Join-Path $env:RUNNER_TEMP 'OpenSSH-Win64'
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          New-Item -ItemType Directory -Force dist/windows/openssh | Out-Null
          Copy-Item "$extract/OpenSSH-Win64/*" dist/windows/openssh -Recurse -Force

      - name: Verify Windows terminal and bundled SSH
        shell: pwsh
        run: |
          $env:MORIXTERM_TEST_SSH_EXE = (Resolve-Path dist/windows/openssh/ssh.exe).Path
          ctest --test-dir build -C ${{ env.BUILD_TYPE }} --output-on-failure

      - name: Build portable Windows ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path dist/windows/* -DestinationPath "release/MoriXterm-$env:RELEASE_VERSION-Windows-x64-Portable.zip" -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        env:
          MORIXTERM_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging/windows/MoriXterm.iss

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: release/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [prepare, linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify complete release assets
        shell: bash
        run: |
          set -euo pipefail
          test -f "release-assets/MoriXterm-${RELEASE_VERSION}-Windows-x64-Setup.exe"
          test -f "release-assets/MoriXterm-${RELEASE_VERSION}-Windows-x64-Portable.zip"
          test -f "release-assets/MoriXterm-${RELEASE_TAG}-Linux-x86_64.AppImage"
          compgen -G "release-assets/*_${RELEASE_VERSION}_amd64.deb" >/dev/null

      - name: Create version tag
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "Release tag ${RELEASE_TAG} already exists" >&2
            exit 1
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            tag -a "${RELEASE_TAG}" "${RELEASE_SHA}" -m "MoriXterm ${RELEASE_TAG}"
          git push origin "refs/tags/${RELEASE_TAG}"

      - name: Publish release
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "MoriXterm ${RELEASE_TAG}" \
            --generate-notes
