name: Build and Release

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to rebuild (leave blank for the next version)'
        required: false
        type: string

concurrency:
  group: morixterm-release
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

env:
  BUILD_TYPE: Release

jobs:
  prepare:
    name: Resolve release version and source
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Require main branch
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        shell: bash
        run: test "$GITHUB_REF" = 'refs/heads/main'

      - name: Checkout source with tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test release workflow logic
        run: |
          python3 -m pip install -r scripts/requirements-ci.txt
          python3 -B -m unittest discover -s tests -p 'test_*.py'

      - name: Resolve release version
        id: version
        shell: bash
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${EVENT_TAG:-${REQUESTED_TAG:-}}"
          if [ -n "$tag" ]; then
            if [[ ! "$tag" =~ ^v[1-9][0-9]*(\.(0|[1-9][0-9]*)){0,2}$ ]]; then
              echo 'Use a numeric release tag such as v4 or v4.1.0.' >&2
              exit 1
            fi
            sha="$(git rev-parse --verify "refs/tags/${tag}^{commit}")"
            if [ "$GITHUB_EVENT_NAME" = release ] && [ "$sha" != "$GITHUB_SHA" ]; then
              echo 'Release tag moved after the event was created.' >&2
              exit 1
            fi
          else
            # push to main and blank workflow_dispatch create the next major tag.
            tag="$(python3 scripts/next_release_version.py)"
            sha="$(git rev-parse HEAD)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux DEB and optional AppImage
    needs: prepare
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ patchelf file desktop-file-utils \
            qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools qt6-tools-dev qt6-tools-dev-tools \
            libgl1-mesa-dev libx11-dev libxfixes-dev libxkbcommon-x11-0 libxcb-cursor0 \
            libsecret-tools openssh-client sshpass libqt6svg6 zip unzip

      - name: QML duplicate property preflight
        run: python3 scripts/check-qml-duplicate-properties.py qml

      - name: SQLite session migration smoke test
        run: python3 scripts/smoke-session-migration.py

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${BUILD_TYPE} -DCMAKE_INSTALL_PREFIX=/usr -DMORIXTERM_VERSION=${RELEASE_VERSION}

      - name: QML syntax check
        shell: bash
        run: |
          QMLFORMAT="$(command -v qmlformat || true)"
          if [ -z "$QMLFORMAT" ] && [ -x /usr/lib/qt6/bin/qmlformat ]; then
            QMLFORMAT=/usr/lib/qt6/bin/qmlformat
          fi
          if [ -z "$QMLFORMAT" ]; then
            echo "qmlformat not found" >&2
            exit 1
          fi
          while IFS= read -r -d '' file; do
            "$QMLFORMAT" "$file" >/dev/null
          done < <(find qml -name '*.qml' -print0)

      - name: Build
        run: cmake --build build --parallel

      - name: RDP argument tests
        run: ctest --test-dir build --output-on-failure

      - name: Package DEB
        run: |
          mkdir -p release
          cd build
          cpack -G DEB -B ../release \
            -D "CPACK_DEBIAN_FILE_NAME=morixterm_${RELEASE_VERSION}_amd64.deb"
          dpkg-deb --info "../release/morixterm_${RELEASE_VERSION}_amd64.deb"

      - name: Build optional AppImage
        id: appimage
        continue-on-error: true
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          QML_SOURCES_PATHS: '${{ github.workspace }}/qml'
          QMAKE: /usr/bin/qmake6
          OUTPUT: 'MoriXterm-${{ env.RELEASE_TAG }}-Linux-x86_64.AppImage'
        run: |
          rm -rf AppDir
          DESTDIR="$GITHUB_WORKSPACE/AppDir" cmake --install build
          curl -L --fail --retry 3 -o linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -L --fail --retry 3 -o linuxdeploy-plugin-qt-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
          export PATH="$GITHUB_WORKSPACE:$PATH"
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --desktop-file packaging/linux/morixtrem.desktop \
            --icon-file assets/morixtrem.png \
            --plugin qt \
            --output appimage
          test -s "$OUTPUT"
          mv -- "$OUTPUT" "release/$OUTPUT"

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: release/morixterm_${{ env.RELEASE_VERSION }}_amd64.deb
          if-no-files-found: error

      - name: Upload AppImage
        id: appimage_upload
        if: steps.appimage.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage-packages
          path: release/MoriXterm-${{ env.RELEASE_TAG }}-Linux-x86_64.AppImage
          if-no-files-found: error

      - name: Report optional AppImage failure
        if: steps.appimage.outcome == 'failure' || steps.appimage_upload.outcome == 'failure'
        run: echo '::warning::AppImage packaging failed. DEB and Windows packages will still be released.'

  windows:
    name: Windows installer EXE and portable ZIP
    needs: prepare
    runs-on: windows-2022
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: QML duplicate property preflight
        shell: pwsh
        run: python scripts/check-qml-duplicate-properties.py qml

      - name: SQLite session migration smoke test
        shell: pwsh
        run: python scripts/smoke-session-migration.py

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DMORIXTERM_VERSION=$env:RELEASE_VERSION"

      - name: Build
        shell: pwsh
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          Copy-Item build/bin/Release/morixtrem.exe dist/windows/morixtrem.exe
          windeployqt --release --qmldir qml --dir dist/windows dist/windows/morixtrem.exe

      - name: Bundle MSVC runtime for portable use
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vsPath) { throw 'Visual C++ installation was not found.' }
          $crt = Get-ChildItem "$vsPath/VC/Redist/MSVC/*/x64/Microsoft.VC143.CRT" -Directory |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $crt) { throw 'The x64 Visual C++ runtime was not found.' }
          Copy-Item "$($crt.FullName)/*.dll" dist/windows/ -Force

      - name: Bundle OpenSSH client
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{
            'User-Agent' = 'MoriXterm'
            'Authorization' = "Bearer $env:GH_TOKEN"
            'Accept' = 'application/vnd.github+json'
          }
          $release = Invoke-RestMethod -Headers $headers -Uri 'https://api.github.com/repos/PowerShell/Win32-OpenSSH/releases/latest'
          $asset = $release.assets | Where-Object { $_.name -eq 'OpenSSH-Win64.zip' } | Select-Object -First 1
          if (-not $asset) { throw 'OpenSSH-Win64.zip was not found in the latest Win32-OpenSSH release.' }
          $archive = Join-Path $env:RUNNER_TEMP 'OpenSSH-Win64.zip'
          Invoke-WebRequest -Headers $headers -Uri $asset.browser_download_url -OutFile $archive
          $extract = Join-Path $env:RUNNER_TEMP 'OpenSSH-Win64'
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          New-Item -ItemType Directory -Force dist/windows/openssh | Out-Null
          Copy-Item "$extract/OpenSSH-Win64/*" dist/windows/openssh -Recurse -Force

      - name: Verify Windows terminal and bundled SSH
        shell: pwsh
        run: |
          $env:MORIXTERM_TEST_SSH_EXE = (Resolve-Path dist/windows/openssh/ssh.exe).Path
          ctest --test-dir build -C ${{ env.BUILD_TYPE }} --output-on-failure
          foreach ($path in @('pty-trace.txt', 'build/pty-trace.txt')) {
            if (Test-Path $path) { Write-Host "---- $path ----"; Get-Content $path }
          }

      - name: Show PTY trace
        if: always()
        shell: pwsh
        run: |
          $found = $false
          foreach ($path in @('pty-trace.txt', 'build/pty-trace.txt')) {
            if (Test-Path $path) { Write-Host "---- $path ----"; Get-Content $path; $found = $true }
          }
          if (-not $found) { Write-Host 'pty-trace.txt was not written' }

      - name: Build portable Windows ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path dist/windows/* -DestinationPath "release/MoriXterm-$env:RELEASE_VERSION-Windows-x64-Portable.zip" -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        env:
          MORIXTERM_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging/windows/MoriXterm.iss

      - name: Verify Windows packages
        shell: pwsh
        run: |
          $requiredFiles = @('morixtrem.exe', 'Qt6Core.dll', 'platforms/qwindows.dll',
            'sqldrivers/qsqlite.dll', 'openssh/ssh.exe', 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')
          foreach ($name in @("MoriXterm-$env:RELEASE_VERSION-Windows-x64-Setup.exe",
                               "MoriXterm-$env:RELEASE_VERSION-Windows-x64-Portable.zip")) {
            if (-not (Test-Path "release/$name" -PathType Leaf)) { throw "Missing package: $name" }
            if ((Get-Item "release/$name").Length -eq 0) { throw "Empty package: $name" }
          }
          $portableCheck = Join-Path $env:RUNNER_TEMP 'morixterm-portable-check'
          Expand-Archive "release/MoriXterm-$env:RELEASE_VERSION-Windows-x64-Portable.zip" $portableCheck -Force
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path "$portableCheck/$file" -PathType Leaf)) { throw "Missing portable runtime file: $file" }
          }

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            release/MoriXterm-${{ env.RELEASE_VERSION }}-Windows-x64-Setup.exe
            release/MoriXterm-${{ env.RELEASE_VERSION }}-Windows-x64-Portable.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [prepare, linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: '*-packages'
          merge-multiple: true

      - name: Verify complete release assets
        shell: bash
        run: |
          set -euo pipefail
          test -s "release-assets/MoriXterm-${RELEASE_VERSION}-Windows-x64-Setup.exe"
          test -s "release-assets/MoriXterm-${RELEASE_VERSION}-Windows-x64-Portable.zip"
          test -s "release-assets/morixterm_${RELEASE_VERSION}_amd64.deb"

      - name: Create or verify version tag
        shell: bash
        run: |
          set -euo pipefail
          remote_tag="$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}")"
          if [ -n "$remote_tag" ]; then
            git fetch --no-tags origin "refs/tags/${RELEASE_TAG}"
            test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$RELEASE_SHA"
          else
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              tag -a "${RELEASE_TAG}" "${RELEASE_SHA}" -m "MoriXterm ${RELEASE_TAG}"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

      - name: Publish or update release assets
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "MoriXterm $RELEASE_TAG" --generate-notes
          fi
