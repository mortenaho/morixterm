name: morixterm
description: A focused Flutter desktop client for RDP sessions and file transfer.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  dartssh2: ^4.1.0
  xterm: ^4.0.0
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/morixtrem-mark.png
    - assets/morixterm-brand.png
    - assets/wordmark.png
